<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistiques</title>
    <style>
        /* Style global */
        body {
            font-family: Arial, sans-serif;
            background-color: #272727;
            margin: 0;
            padding: 5px;
            text-align: center;
            padding-top: 30px;
        }
tr {
    background-color:#434242 ;
}
        .container {
            max-width: 900px;
            margin: auto;
        }

        /* Style des cartes */
        .card {
            background: #434242;
            color: white;
            padding: 5px;
            border-radius: 8px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        /* Style pour afficher les moyennes en ligne */
        .stats-container {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 15px;
        }
        h2 {
            color:white !important;
        }

        .stats-box {
            flex: 1;
            padding: 5px;
            background: #434242;
            color: white;

            border-radius: 8px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        h2 {
            color: #333;
        }

        /* Tableaux stylés */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            color: white !important;
        }

        table, th, td {
            border: 1px solid #ddd;
        }

        th, td {
            padding: 5px;
            text-align: center;
        }

        th {
            background-color: #007BFF;
            color: white;
        }


        /* Ligne de séparation pour les changements d'année */
        .year-separator {
            background-color: #001b39;
            color: white;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Affichage du total des cintres enregistrés -->
    <div class="card">
        <h2>Nombre total de cintres enregistrés</h2>
        <div id="totalCintres">Chargement...</div>
    </div>

    <!-- Les autres sections -->
    <div class="stats-container">
        <div class="stats-box" id="moyenneMecanique">Moyenne mécanique : -- jours</div>
        <div class="stats-box" id="moyennePuce">Moyenne puce : -- jours</div>
    </div>

    <div class="card">
        <h2>Statistiques des cintres</h2>
        <div id="statsCintres"></div>
    </div>

    <div class="card">
        <h2>Réparations par utilisateur</h2>
        <div id="statsReparations"></div>
    </div>
</div>


    <script>
        async function fetchJSON(file) {
            try {
                const response = await fetch(file);
                if (!response.ok) throw new Error("Fichier introuvable");
                return await response.json();
            } catch (error) {
                console.warn(`Erreur lors du chargement de ${file}: ${error.message}`);
                return null;
            }
        }

      async function loadStats() {
    // Charger les fichiers JSON
    const statsCintres = await fetchJSON("../data/0_Cintres/00A_stats.json") || {};
    const statsReparations = await fetchJSON("../data/0_Cintres/00A_stats_rep_user.json") || {};
    const statsMeca = await fetchJSON("../data/0_Cintres/00A_stats_mecanique.json") || { durations: [] };
    const statsPuce = await fetchJSON("../data/0_Cintres/00A_stats_puce.json") || { durations: [] };

    // Trier les années de la plus récente à la plus ancienne
    const sortYears = (obj) => Object.keys(obj).sort((a, b) => b - a);

    // Calcul du nombre total de cintres
    let totalCintres = 0;
    Object.keys(statsCintres).forEach(year => {
        Object.keys(statsCintres[year]).forEach(user => {
            totalCintres += statsCintres[year][user];
        });
    });

    // Affichage du total des cintres
    document.getElementById("totalCintres").innerText = `Total cintres enregistrés : ${totalCintres}`;

    // Affichage des cintres par année avec séparation
    let cintresHTML = "<table><tr><th>Année</th><th>Utilisateur</th><th>Cintres</th></tr>";
    let hasCintresData = false;
    let sortedYears = sortYears(statsCintres);
    sortedYears.forEach((year, index) => {
        cintresHTML += `<tr class="year-separator"><td colspan="3">${year}</td></tr>`;
        for (let user in statsCintres[year]) {
            cintresHTML += `<tr><td>${year}</td><td>${user}</td><td>${statsCintres[year][user]}</td></tr>`;
            hasCintresData = true;
        }
    });
    cintresHTML += "</table>";
    document.getElementById("statsCintres").innerHTML = hasCintresData ? cintresHTML : "<p>Aucune donnée disponible.</p>";

    // Affichage des réparations par année avec séparation
    let reparationsHTML = "<table><tr><th>Année</th><th>Utilisateur</th><th>Réparations</th></tr>";
    let hasReparationsData = false;
    sortedYears = sortYears(statsReparations);
    sortedYears.forEach((year, index) => {
        reparationsHTML += `<tr class="year-separator"><td colspan="3">${year}</td></tr>`;
        for (let user in statsReparations[year]) {
            reparationsHTML += `<tr><td>${year}</td><td>${user}</td><td>${statsReparations[year][user]}</td></tr>`;
            hasReparationsData = true;
        }
    });
    reparationsHTML += "</table>";
    document.getElementById("statsReparations").innerHTML = hasReparationsData ? reparationsHTML : "<p>Aucune donnée disponible.</p>";

    // Calcul de la moyenne des réparations mécaniques
    let moyenneMeca = statsMeca.durations.length > 0
        ? statsMeca.durations.reduce((a, b) => a + b, 0) / statsMeca.durations.length
        : null;
    document.getElementById("moyenneMecanique").innerText = moyenneMeca !== null
        ? `Moyenne mécanique : ${moyenneMeca.toFixed(2)} jours`
        : "Moyenne mécanique : Aucune donnée";

    // Calcul de la moyenne de durée de vie des puces
    let moyennePuce = statsPuce.durations.length > 0
        ? statsPuce.durations.reduce((a, b) => a + b, 0) / statsPuce.durations.length
        : null;
    document.getElementById("moyennePuce").innerText = moyennePuce !== null
        ? `Moyenne puce : ${moyennePuce.toFixed(2)} jours`
        : "Moyenne puce : Aucune donnée";
}

        loadStats();
    </script>
</body>
</html>
