<!DOCTYPE html>
<html lang="fr" translate="no">

<head translate="no">
    <meta charset="UTF-8">
    <title>Chrono</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">


    <link rel="icon" type="image/png" href="../../SVG/LOGO.svg">
</head>


<li class="active-chrono">
    <div class="modal-content">

        <div class="place-details" style="display: flex;">
            <div class="chrono-status" style="color: limegreen;">En cours</div>
            <div id="chrono">Initialisation</div>
            <button class="modal-button" id="updateTimeButton">🕔</button>




            <!-- Conteneur pour l'ensemble de la ligne -->
            <div class="row-container">
                <!-- Labels et listes déroulantes sur la même ligne -->
                <div class="dropdowns-container">
                    <label for="typeInput">Type:</label>
                    <input id="typeDropdown" list="typeList" placeholder="Sélectionnez ou tapez un type">
                    <datalist id="typeList">
                        <!-- Options de type ici -->
                    </datalist>
                </div>
                <div class="dropdowns-container">
                    <label for="causeInput">Cause:</label>
                    <input id="causeDropdown" list="causeList" placeholder="Sélectionnez ou tapez une cause">
                    <datalist id="causeList">
                        <!-- Options de cause ici -->
                    </datalist>
                </div>

            </div>

            <div class="input-container">
                <label for="tempsArretsInput">Temps d'arrêts:</label>
                <input type="time" id="tempsArretsInput" name="tempsArretsInput" min="00:00" max="23:59" value="00:00">
            </div>


            <!-- Première zone de texte avec résumé -->
            <label for="causeInput">Résumé de l'intervention:</label>
            <textarea id="zone-texte" placeholder="Saisissez quelque chose..."></textarea>

            <script>
                document.getElementById('zone-texte').addEventListener('keydown', function(event) {
                    // Si la touche "Entrée" (code 13) est pressée
                    if (event.key === "Enter") {
                        event.preventDefault(); // Empêche le saut de ligne
                    }
                });
            </script>
            <label for="causeInput" style="display: none;">Sortie de pièces :</label>

            <!-- Conteneur pour afficher dynamiquement les capsules avec défilement horizontal -->
            <div id="capsules-container" style="display: none;" style="padding: 8px; border: 1px solid #ccc; min-height: 30px; display: flex; flex-wrap: nowrap; gap: 10px; overflow-x: auto; white-space: nowrap; background: rgba(100,100,100,0.5); border-radius: 10px;">
                <!-- Les capsules seront affichées ici -->
            </div>

            <!-- Styles pour gérer les barres de défilement -->
            <style>
                /* Par défaut : cacher la barre de défilement sur mobile et permettre le défilement horizontal */
                #capsules-container {
                    overflow-x: auto;
                    /* Activer le défilement horizontal */
                    -webkit-overflow-scrolling: touch;
                    /* Défilement fluide sur mobile */
                }

                /* Masquer la barre de défilement horizontale dans Webkit (Chrome, Safari) sur mobile */
                #capsules-container::-webkit-scrollbar {
                    height: 0px;
                    /* Masquer la barre de défilement horizontale */
                }

                /* Masquer la barre de défilement dans les navigateurs modernes (Edge, Firefox) sur mobile */
                #capsules-container {
                    -ms-overflow-style: none;
                    /* Pour IE/Edge */
                    scrollbar-width: none;
                    /* Pour Firefox */
                }

                /* Sur les écrans plus grands (PC) : afficher la barre de défilement */
                @media (min-width: 601px) {
                    #capsules-container {
                        overflow-x: scroll;
                        /* Afficher la barre de défilement sur PC */
                    }

                    /* Afficher la barre de défilement horizontale dans Webkit (Chrome, Safari) */
                    #capsules-container::-webkit-scrollbar {
                        height: 8px;
                        /* Taille de la barre de défilement horizontale */
                        background: transparent;
                    }

                    /* Afficher la barre de défilement dans les navigateurs modernes (Edge, Firefox) */
                    #capsules-container {
                        scrollbar-width: thin;
                        /* Barre de défilement fine sur PC */
                    }
                }
            </style>



            <!-- Zone de texte (masquée ou visible selon préférence) -->
            <textarea id="zone-pieces" placeholder="Pièces de sortie... (Facultatif)" style="width: 100%; display: none;"></textarea>

            <!-- Conteneur flex pour la zone de texte et le bouton -->
            <div style="display: flex; align-items: stretch; gap: 10px; flex-wrap: nowrap;">
                <!-- Bouton Ajouter pièce -->
                <button id="add-piece-button" class="modal-button" onclick="//SendPiece()" style="display: none;" style="background-color: grey; color: white; border: none; padding: 2px; border-radius: 8px; cursor: pointer; width: 100px; min-width: 20%;">
                    Ajouter pièce
                </button>
            </div>







            <div id="buttons" style="display: flex; margin-top: 10px;">
                <button class="modal-button" style="width: 100%;" onclick="cancelChrono()">Annuler</button>
                <button class="modal-button" style="background-color: yellow; color: black; width: 100%;" onclick="pauseResumeChrono()">Pause</button>
                <button class="modal-button" style="background-color: red; color: black; width: 100%;" onclick="saveRecord()">Enregistrer</button>
            </div>
        </div>
    </div>
</li>
<script>
window.crhono = true;
  /**
   * Récupère le contenu d’un fichier depuis IndexedDB.
   * @param {string} fileName - Le nom ou chemin relatif du fichier.
   * @returns {Promise<string>} Le contenu du fichier.
   */
  async function getFileFromDB(fileName) {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open("MyAppDBStory", 1);
      request.onsuccess = event => {
        const db = event.target.result;
        const transaction = db.transaction("filesStory", "readonly");
        const store = transaction.objectStore("filesStory");
        const getRequest = store.get(fileName);

        getRequest.onsuccess = () => {
          if (getRequest.result) {
            resolve(getRequest.result);
          } else {
            reject(`Fichier non trouvé dans IndexedDB : ${fileName}`);
          }
        };
        getRequest.onerror = () => reject(`Erreur de récupération du fichier : ${fileName}`);
      };
      request.onerror = () => reject("Erreur d'accès à IndexedDB");
    });
  }

  /**
   * Récupère le contenu d’un fichier en essayant IndexedDB puis fetch.
   * @param {string} fileName - Le nom ou chemin relatif du fichier.
   * @returns {Promise<string>} Le contenu du fichier.
   */
  async function getFileContent(fileName) {
    try {
      return await getFileFromDB(fileName);
    } catch (error) {
      console.warn(`${error}. Tentative via fetch pour ${fileName}...`);
      try {
        const response = await fetch(fileName);
        if (!response.ok) {
          throw new Error(`Erreur HTTP ${response.status}`);
        }
        return await response.text();
      } catch (fetchError) {
        throw new Error(`Impossible de charger ${fileName} via fetch: ${fetchError}`);
      }
    }
  }

  /**
   * Charge les fichiers CSS et JS en les injectant dans le document avec un commentaire sourceURL
   * pour que chaque fichier apparaisse dans l'onglet Sources du navigateur.
   */
  async function loadFromIndexedDB() {
    // Chargement et injection du CSS
    try {
      const styleContent = await getFileContent("CSS/style-chrono.css");
      const styleElement = document.createElement("style");
      // Ajout d'un commentaire sourceURL pour que le CSS apparaisse comme un fichier séparé
      styleElement.textContent = styleContent + "\n/*# sourceURL=CSS/style-chrono.css */";
      document.head.appendChild(styleElement);
    } catch (error) {
      console.warn("Style CSS introuvable :", error);
    }

    // Liste des scripts à charger
    const scripts = [
      "Rais.js",
      "JS/Data.js",
      "JS/Script-chrono.js",
      "JS/Bip.js"
    ];

    // Boucle pour charger et injecter chaque script
    for (const file of scripts) {
      try {
        const scriptContent = await getFileContent(file);
        const scriptElement = document.createElement("script");
        // Ajout d'un commentaire sourceURL pour permettre le débogage dans l'onglet Sources
        scriptElement.textContent = scriptContent + "\n//# sourceURL=" + file;
        document.head.appendChild(scriptElement);
      } catch (error) {
        console.warn(`Script introuvable : ${file}`, error);
      }
    }

    // Exécution d'une fonction de démarrage si elle existe


  // Récupérer l'élément contenant l'URL de base (ici on suppose que c'est un élément <Variable> avec un attribut "ct")
  const baseElement = document.querySelector('base');
  if (baseElement) {
    const baseHref = baseElement.getAttribute('href');

    const newUrl = baseHref;
    // Remplacer complètement l'URL actuelle dans l'historique
    window.history.replaceState({}, '', newUrl);
  } else {
    console.warn("Aucune balise 'Variable' trouvée.");
  }

  // Lire les paramètres de la nouvelle URL
  const lieu = getURLParameter('lieu');
  const temps = getURLParameter('temps');

  // Initialisation après la mise à jour
  init(lieu, temps);



  }

  // Démarrage du chargement des fichiers
  loadFromIndexedDB();
</script>
