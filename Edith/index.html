<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un Nouveau Regroupement</title>
    <script src="../Ressources/JS/Lieu.js"></script>
    <script src="../Work/regroup.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="block">
        <h1>Créer un Nouveau Regroupement</h1>
        <label for="regroupName">Nom du Regroupement :</label>
        <input type="text" id="regroupName" placeholder="Nom du regroupement">
    </div>
    <div id="block">
        <h2>Sélectionnez des Lieux</h2>
        <div id="lieuSelection"></div>
        <button id="addRegroup">Créer le Regroupement</button>
    </div>
    <div id="block">
        <h2>Supprimer un Regroupement</h2>
        <label for="deleteRegroupSelect">Sélectionnez un Regroupement :</label>
        <select id="deleteRegroupSelect">
            <option value="">-- Sélectionnez un regroupement --</option>
        </select>
        <button id="deleteRegroup">Supprimer</button>
    </div>
    <div id="block">
        <h2>Regroupements Actuels</h2>
        <pre id="currentRegroups"></pre>
    </div>
    <script>
        // Vérifie si les données des fichiers sont disponibles
        if (typeof arborescence === 'undefined' || typeof Regroups === 'undefined') {
            alert("Erreur : Les fichiers Lieu.js ou regroup.js ne sont pas correctement chargés.");
        }

        const lieuContainer = document.getElementById("lieuSelection");
        const currentRegroups = document.getElementById("currentRegroups");
        const deleteRegroupSelect = document.getElementById("deleteRegroupSelect");

        // Fonction pour afficher les regroupements actuels
        const afficherRegroupements = () => {
            currentRegroups.textContent = JSON.stringify(Regroups, null, 4);
            remplirListeSuppression();
        };

        // Remplir la liste déroulante pour supprimer un regroupement
        const remplirListeSuppression = () => {
            deleteRegroupSelect.innerHTML = '<option value="">-- Sélectionnez un regroupement --</option>';
            Object.keys(Regroups).forEach(regroupName => {
                const option = document.createElement("option");
                option.value = regroupName;
                option.textContent = regroupName;
                deleteRegroupSelect.appendChild(option);
            });
        };

        afficherRegroupements();

        // Fonction récursive pour afficher les lieux sous forme de cases à cocher
        const afficherLieux = (arborescence, parent = lieuContainer, chemin = []) => {
            Object.keys(arborescence).forEach(key => {
                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.id = chemin.concat(key).join(" > ");
                checkbox.value = chemin.concat(key).join(" > ");

                const label = document.createElement("label");
                label.htmlFor = checkbox.id;
                label.textContent = key;

                const container = document.createElement("div");
                container.appendChild(checkbox);
                container.appendChild(label);

                parent.appendChild(container);

                // Si le lieu a des sous-éléments, les afficher récursivement
                if (Object.keys(arborescence[key]).length > 0) {
                    const subContainer = document.createElement("div");
                    subContainer.style.marginLeft = "20px";
                    container.appendChild(subContainer);
                    afficherLieux(arborescence[key], subContainer, chemin.concat(key));
                }
            });
        };

        // Affiche les lieux au chargement de la page
        afficherLieux(arborescence);

        // Gère la création d'un regroupement
        document.getElementById("addRegroup").addEventListener("click", () => {
            const regroupName = document.getElementById("regroupName").value.trim();
            if (!regroupName) {
                alert("Veuillez entrer un nom pour le regroupement.");
                return;
            }

            const selectedLieux = Array.from(lieuContainer.querySelectorAll("input:checked")).map(input => input.value);

            if (selectedLieux.length === 0) {
                alert("Veuillez sélectionner au moins un lieu.");
                return;
            }

            const regroupementStructure = selectedLieux.reduce((acc, lieuPath) => {
                const segments = lieuPath.split(" > ");
                const lastSegment = segments.pop();
                acc[lastSegment] = [];
                return acc;
            }, {});

            Regroups[regroupName] = regroupementStructure;

            fetch('updateRegroups.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(Regroups),
            })
            .then(response => {
                if (response.ok) {
                    return response.text();
                } else {
                    throw new Error("Erreur lors de la mise à jour");
                }
            })
            .then(text => {
                alert(text);
                afficherRegroupements();
            })
            .catch(error => {
                console.error("Erreur :", error);
                alert("Une erreur est survenue lors de la mise à jour");
            });
        });

        // Gère la suppression d'un regroupement
        document.getElementById("deleteRegroup").addEventListener("click", () => {
            const selectedRegroup = deleteRegroupSelect.value;
            if (!selectedRegroup) {
                alert("Veuillez sélectionner un regroupement à supprimer.");
                return;
            }

            if (confirm(`Êtes-vous sûr de vouloir supprimer le regroupement "${selectedRegroup}" ?`)) {
                delete Regroups[selectedRegroup];

                fetch('updateRegroups.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(Regroups),
                })
                .then(response => {
                    if (response.ok) {
                        return response.text();
                    } else {
                        throw new Error("Erreur lors de la suppression");
                    }
                })
                .then(text => {
                    alert(text);
                    afficherRegroupements();
                })
                .catch(error => {
                    console.error("Erreur :", error);
                    alert("Une erreur est survenue lors de la suppression");
                });
            }
        });
    </script>
</body>
</html>
