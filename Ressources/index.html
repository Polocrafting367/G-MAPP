    const lastSaveKey = DB_CONFIG[modeFinal].LAST_SAVE_KEY;

  console.log("⚠️ Dev.txt indique de forcer le rechargement complet.");

}


    if (!isNaN(localTimestamp) && !isNaN(maxHours)) {
      const maxMs = maxHours * 60 * 60 * 1000;

async function fetchAndStore(filePath, dbName, storeName) {
  try {
    document.getElementById("loading-detail").textContent = `Chargement : ${filePath}`;

    const response = await fetch(filePath);
    if (!response.ok) throw new Error(`Erreur fichier ${filePath}`);
    const content = await response.text();

    const shortName = filePath.replace(/(\.\.\/)+|G-MAPP\/|Ressources\/|(Work|Priv|Story)\//g, '');
    const db = await openDatabase(dbName, storeName);
    const existing = await getStoredFile(db, storeName, shortName);

    if (existing !== content) {
      await storeFile(db, storeName, shortName, content);
    }

    updateProgress();
  } catch (error) {
    console.error("❌ fetchAndStore error :", error);
    updateProgress();
  }

}

async function listFilesInDB(dbName, storeName) {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(dbName, 1);
    request.onsuccess = event => {
      const db = event.target.result;
      const tx = db.transaction(storeName, "readonly");
      const store = tx.objectStore(storeName);
      const keysRequest = store.getAllKeys();

      keysRequest.onsuccess = () => {
        const keys = keysRequest.result;
        console.log(`✅ Clés présentes dans ${dbName}/${storeName} :`, keys);
        resolve(keys);
      };
      keysRequest.onerror = () => {
        console.error(`❌ Erreur lors de la récupération des clés de ${dbName}/${storeName}`);
        reject(keysRequest.error);
      };
    };
    request.onerror = () => {
      console.error(`❌ Erreur ouverture DB ${dbName}`);
      reject(request.error);
    };
  });
}


async function openDatabase(dbName, storeName) {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(dbName, 1);
    request.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(storeName)) {
        db.createObjectStore(storeName);
      }
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(`❌ Erreur ouverture DB ${dbName}`);
  });
}

async function getStoredFile(db, storeName, key) {
  return new Promise(resolve => {
    const tx = db.transaction(storeName, "readonly");
    const store = tx.objectStore(storeName);
    const req = store.get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null);
  });
}

async function storeFile(db, storeName, key, content) {
  return new Promise(resolve => {
    const tx = db.transaction(storeName, "readwrite");
    tx.objectStore(storeName).put(content, key);
    tx.oncomplete = resolve;
  });
}

    return;
  }

  const currentUrl = window.location.href;
  const parts = currentUrl.split("index.html");
  let dynamicPart = parts[1] || "";
  let paramsString = "";

  if (dynamicPart.startsWith("?")) {
    paramsString = dynamicPart.substring(1);
  }
  if (paramsString.startsWith("&")) {
    paramsString = paramsString.substring(1);
  }



  const baseUrl = "start.html";
  const finalUrl = `${baseUrl}?${paramsString}`;

  document.body.innerHTML = '';

  const iframe = document.createElement("iframe");
  iframe.id = "startIframe";

  iframe.style.zIndex = "9999";

  document.body.appendChild(iframe);

  setTimeout(() => {
    const docIframe = iframe.contentDocument || iframe.contentWindow.document;
    if (docIframe) {
      docIframe.open();
      docIframe.write(`<base href="${finalUrl}">` + startContent);
      docIframe.close();
    } else {
      console.error("❌ Impossible d'accéder au document de l'iframe.");
    }
  }, 50);

async function createDeviceId2() {
  try {
    const browserInfo = navigator.userAgent;

    // Récupérer le paramètre `device` dans l'URL

    // Exemple final : "Mozilla/5.0... - MonScanner01"
    return `${browserInfo}-${deviceName}`;
  } catch (error) {
    console.error("Erreur lors de la création de l'ID d'appareil:", error);
    return `${navigator.userAgent}-unknownDevice`;
  }
}



function getLocalIP2() {
  return new Promise((resolve, reject) => {
    const pc = new RTCPeerConnection({ iceServers: [] });
    pc.createDataChannel('');
    pc.createOffer()
      .then((offer) => pc.setLocalDescription(offer))
      .catch((error) => reject('Error setting local description:', error));

    pc.onicecandidate = (event) => {
      if (!event || !event.candidate) return;
      const ipRegex = /([0-9]{1,3}(\.[0-9]{1,3}){3})/;
      const match = ipRegex.exec(event.candidate.candidate);
      if (match) {
        const ipAddress = match[1];
        resolve(ipAddress);
      } else {
        reject("Aucune adresse IP trouvée");
      }
      pc.onicecandidate = null;
    };
  });
}

async function fetchWithRetry2(url, options = {}, retries = 3, backoff = 300) {
  if (!navigator.onLine || connectionQuality <= 0) {
    console.warn(`⛔ Hors ligne : tentative ignorée pour ${url}`);
    return null;
  }

  let finalResponse = null;
  let stop = false;

  // Lancer le timer en parallèle
  const lockPromise = new Promise(resolve2 => {
    setTimeout(() => {
      console.log("⏰ Temps simulé 3s terminé (en parallèle)");
      resolve2();
    }, 3000);
  });

  // Boucle principale de retry
  while (!stop) {
    for (let i = 0; i < retries; i++) {
      try {
        const response = await fetch(url, options);
        if (response.ok) {
          finalResponse = response;
          console.log("✅ Fichier modifié / envoyé à nouveau");
          break;
        }
      } catch (error) {
        if (navigator.onLine) {
          console.error(`Tentative ${i + 1} échouée pour ${url}:`, error);
        }
      }
      await new Promise(resolve2 => setTimeout(resolve2, backoff));
      backoff *= 2;
    }

    await new Promise(resolve2 => setTimeout(resolve2, 200));
    stop = true;
  }

  // Ici on ne fait PAS `await lockPromise` ⇒ le reste du code n’est pas bloqué
  // Tu peux décider de l'attendre ailleurs si besoin

  return finalResponse;
}

async function getAllFilesCount() {
  let count = 0;

  for (const mode of MODES) {
    const files = await fetchFileList(mode);
    count += files.length;
  }

  // Si tu ajoutes manuellement des fichiers spécifiques (comme dans Work, Priv, Story), ils sont déjà ajoutés dans fetchFileList()
  return count;
}
