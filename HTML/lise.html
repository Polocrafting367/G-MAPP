// --- EXPORT FUNCTION WITH DYNAMIC LEGEND ---
function exportSpecificChart(canvasId, title) {
    const originalCanvas = document.getElementById(canvasId);
    if (!originalCanvas) {
        console.error("Canvas introuvable :", canvasId);
        return;
    }

    // 1. Déterminer la légende dynamique (Sous-titre)
    let subtitle = "";
    
    if (canvasId === 'mainChart') {
        const mSel = document.getElementById('metricSelect');
        const gSel = document.getElementById('groupBySelect');
        const metricText = mSel ? mSel.options[mSel.selectedIndex].text : "";
        const groupText = gSel ? gSel.options[gSel.selectedIndex].text : "";
        subtitle = `${metricText} • ${groupText}`;
    } 
    else if (canvasId === 'miniChartTime') {
        subtitle = "Évolution temporelle (Interventions)";
    } 
    else if (canvasId === 'miniChartCause') {
        subtitle = "Top 5";
    } 
    else if (canvasId === 'miniChartType') {
        subtitle = "Top 5";
    }
    else {
        subtitle = "Analyse Maintenance";
    }

    // 2. Création du Canvas temporaire
    const tempCanvas = document.createElement('canvas');
    const ctx = tempCanvas.getContext('2d');
    
    // Hauteur du bandeau titre
    const headerHeight = 80; 

    // Dimensions
    tempCanvas.width = originalCanvas.width;
    tempCanvas.height = originalCanvas.height + headerHeight;

    // 3. Fond Blanc
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

    // 4. Fond du Header (Gris clair)
    ctx.fillStyle = '#f8fafc'; 
    ctx.fillRect(0, 0, tempCanvas.width, headerHeight);
    
    // Ligne de séparation
    ctx.beginPath();
    ctx.moveTo(0, headerHeight);
    ctx.lineTo(tempCanvas.width, headerHeight);
    ctx.strokeStyle = '#e2e8f0';
    ctx.stroke();

    // 5. Configuration Texte
    ctx.textAlign = 'center';
    
    // Titre Principal
    ctx.fillStyle = '#1e293b'; // Slate-800
    ctx.font = 'bold 20px Inter, sans-serif'; 
    ctx.textBaseline = 'bottom';
    ctx.fillText(title.replace(/_/g, ' '), tempCanvas.width / 2, headerHeight / 2 - 2);

    // Sous-titre (Légende)
    ctx.fillStyle = '#64748b'; // Slate-500
    ctx.font = '500 14px Inter, sans-serif';
    ctx.textBaseline = 'top';
    ctx.fillText(subtitle, tempCanvas.width / 2, headerHeight / 2 + 4);

    // 6. Copie du graphique original
    ctx.drawImage(originalCanvas, 0, headerHeight);

    // 7. Téléchargement
    const link = document.createElement('a');
    const timestamp = new Date().toISOString().split('T')[0];
    const cleanTitle = title.replace(/[^a-z0-9]/gi, '_').toLowerCase();
    link.download = `analyse_${cleanTitle}_${timestamp}.jpg`;
    link.href = tempCanvas.toDataURL('image/jpeg', 0.95);
    link.click();
}

                setDefaultDateRange();
                populateFilters();
                analyzeAndPopulateKeywords();

                statusDiv.className = "text-[10px] text-red-700 font-bold flex items-center gap-1 bg-red-100 px-2 py-1 rounded-full border border-red-200";
            }

function initMiniCharts() {
    // Plugin : Texte Foncé avec Halo Blanc (Lisibilité maximale)
    const barLabelPlugin = {
        id: 'barLabelPlugin',
        afterDatasetsDraw(chart) {
            const { ctx } = chart;
            ctx.save();
            ctx.font = 'bold 11px Inter, system-ui, sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';

            const meta = chart.getDatasetMeta(0);
            if (!meta.data.length) return;

            meta.data.forEach((bar, index) => {
                const label = chart.data.labels[index];
                const value = chart.data.datasets[0].data[index];
                const text = `${label} (${value})`;
                
                // Position : décalage de 8px du bord gauche
                const xPos = 8; 
                const yPos = bar.y;

                // 1. DESSINER LE CONTOUR BLANC (HALO)
                // Cela crée une "zone de protection" autour du texte
                ctx.lineWidth = 3;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)'; 
                ctx.lineJoin = 'round';
                ctx.strokeText(text, xPos, yPos);

                // 2. DESSINER LE TEXTE EN GRIS FONCÉ PAR DESSUS
                ctx.fillStyle = '#0f172a'; // Slate-900 (Presque noir, très net)
                ctx.fillText(text, xPos, yPos); 
            });
            ctx.restore();
        }
    };

    const commonOptions = {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { 
            legend: { display: false },
            tooltip: { enabled: false } // Tooltip désactivé car l'info est déjà affichée
        },
        scales: { 
            x: { display: false, min: 0 }, 
            y: { display: false }
        },
        layout: { padding: { left: 0, right: 0, top: 0, bottom: 0 } },
        indexAxis: 'y'
    };

    // 1. Time (Line chart - Pas de plugin texte ici)
    miniCharts.time = new Chart(document.getElementById('miniChartTime'), {
        type: 'line',
        data: { labels: [], datasets: [] },
        options: {
            ...commonOptions,
            indexAxis: 'x',
            scales: { x: { display: false }, y: { display: false } },
            elements: { point: { radius: 0, hitRadius: 10 } }
        }
    });

    // 2. Cause (Bar horizontal - Plugin Activé)
    miniCharts.cause = new Chart(document.getElementById('miniChartCause'), {
        type: 'bar',
        data: { labels: [], datasets: [] },
        plugins: [barLabelPlugin], 
        options: commonOptions
    });

    // 3. Type (Bar horizontal - Plugin Activé)
    miniCharts.type = new Chart(document.getElementById('miniChartType'), {
        type: 'bar',
        data: { labels: [], datasets: [] },
        plugins: [barLabelPlugin], 
        options: commonOptions
    });
}

        function updateMiniCharts(data) {
            const countBy = (field) => {
                const counts = {};
                data.forEach(d => { 
                    let k = (d[field] || "N/A").trim(); 
                    if(Array.isArray(d[field])) k = d[field][0];
                    counts[k] = (counts[k]||0)+1; 
                });
                return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5);
            };

            // 1. Time
            const timeMap = {};
            data.forEach(d => {
                const date = d["Date intervention"];
                if(date && date.length === 8) {
                    const k = `${date.substring(0,4)}-${date.substring(4,6)}`;
                    timeMap[k] = (timeMap[k]||0)+1;
                }
            });
            const timeSorted = Object.entries(timeMap).sort();
            
            const ctxTime = document.getElementById('miniChartTime').getContext('2d');
            const gradTime = ctxTime.createLinearGradient(0,0,0,180);
            gradTime.addColorStop(0, 'rgba(59, 130, 246, 0.4)');
            gradTime.addColorStop(1, 'rgba(59, 130, 246, 0.05)');

            miniCharts.time.data.labels = timeSorted.map(e=>e[0]);
            miniCharts.time.data.datasets = [{
                data: timeSorted.map(e=>e[1]),
                borderColor: '#2563eb',
                backgroundColor: gradTime,
                borderWidth: 2,
                fill: true,
                tension: 0.4
            }];
            miniCharts.time.update();

            // 2. Cause
            const topCauses = countBy("Cause");
            miniCharts.cause.data.labels = topCauses.map(e=>e[0].substring(0, 18) + (e[0].length>18?"...":""));
            miniCharts.cause.data.datasets = [{
                data: topCauses.map(e=>e[1]),
                backgroundColor: ['#ef4444', '#f87171', '#fca5a5', '#fecaca', '#fee2e2'],
                borderRadius: 4,
                barThickness: 15
            }];
            miniCharts.cause.update();

            // 3. Type
            const topTypes = countBy("Type de panne");
            miniCharts.type.data.labels = topTypes.map(e=>e[0].substring(0, 18) + (e[0].length>18?"...":""));
            miniCharts.type.data.datasets = [{
                data: topTypes.map(e=>e[1]),
                backgroundColor: ['#8b5cf6', '#a78bfa', '#c4b5fd', '#ddd6fe', '#ede9fe'],
                borderRadius: 4,

        // --- CORE PROCESS ---
        function processAndRender() {
            const startStr = document.getElementById('dateStart').value;
            const endStr = document.getElementById('dateEnd').value;
            const startInt = startStr ? parseInt(startStr.replaceAll('-','')) : 0;
            const endInt = endStr ? parseInt(endStr.replaceAll('-','')) : 99999999;
            
            const activeTypes = Array.from(document.querySelectorAll('.filter-type:checked')).map(cb => cb.value);
            const activeCauses = Array.from(document.querySelectorAll('.filter-cause:checked')).map(cb => cb.value);
            const activeKeywords = Array.from(document.querySelectorAll('.filter-keyword:checked')).map(cb => cb.value);

            filteredData = rawData.filter(item => {
                const dateVal = item["Date intervention"] ? parseInt(item["Date intervention"]) : 0;
                if (dateVal < startInt || dateVal > endInt) return false;
                
                const typeVal = (item["Type de panne"] || "Non renseigné").trim();
                const causeVal = (item["Cause"] || "Non renseigné").trim();
                
                if (!activeTypes.includes(typeVal)) return false;
                if (!activeCauses.includes(causeVal)) return false;

                if (activeKeywords.length > 0) {
                    const summary = (item["Résumé intervention"] || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                    const hasKeyword = activeKeywords.some(kw => summary.includes(kw));
                    if (!hasKeyword) return false;
                }
                
                return true;
            });

            calculateKPIs(filteredData);
            updateMiniCharts(filteredData);
            updateChart();
            saveState();
        }

function updateChart() {
    // --- 1. MISE A JOUR VISUELLE DES BOUTONS (Nouveau) ---
    // On parcourt tous les boutons radio de granularité
    document.querySelectorAll('input[name="granularity"]').forEach(input => {
        const label = input.parentElement;
        // On remet une base neutre à tout le monde
        label.className = "px-2 py-1 text-[10px] cursor-pointer rounded transition-colors border";
        
        if (input.checked) {
            // Style ACTIF (Bleu, gras, bordure)
            label.classList.add("bg-blue-50", "text-blue-700", "font-bold", "border-blue-100");
        } else {
            // Style INACTIF (Gris, hover léger, bordure invisible)
            label.classList.add("text-slate-500", "hover:bg-slate-50", "border-transparent");
        }
    });

    // --- 2. LOGIQUE DE DONNÉES (Existante) ---
    if (!filteredData.length) { if(mainChartInstance) mainChartInstance.destroy(); return; }
    
    const groupBy = document.getElementById('groupBySelect').value;
    const metric = document.getElementById('metricSelect').value;
    const limitMode = document.getElementById('limitSelect').value;
    const searchTerm = document.getElementById('searchInput').value.trim();
    const granularity = document.querySelector('input[name="granularity"]:checked')?.value || 'month';

    const aggregated = {};
    filteredData.forEach(item => {
        const key = generateKey(item, groupBy, granularity);
        let val = (metric === 'count') ? 1 : (metric === 'downtime') ? parseNum(item["Durée arrêt (h)"]) : parseNum(item["Nombre d'heures"]);
        aggregated[key] = (aggregated[key] || 0) + val;
    });

    let entries = Object.entries(aggregated);
    updateDataList(entries.map(e => e[0]));

    if (groupBy !== 'date') {
        entries.sort((a, b) => b[1] - a[1]);
        if (searchTerm) {
            const idx = entries.findIndex(e => e[0].toLowerCase() === searchTerm.toLowerCase());
            if (idx !== -1) entries = entries.slice(Math.max(0, idx - 4), Math.min(entries.length, idx + 4));
        } else if (limitMode !== 'all') {
            entries = entries.slice(0, parseInt(limitMode));
        }
    } else {
        entries.sort((a, b) => a[0].localeCompare(b[0]));
    }

    const labels = entries.map(e => e[0]);
    const data = entries.map(e => e[1]);

    const container = document.querySelector('.chart-main > div');
    if (labels.length > 30) {
        container.style.width = `${labels.length * 35}px`;
    } else {
        container.style.width = '100%';
    }

    renderMainChart(labels, data, groupBy === 'date' ? 'line' : 'bar');
}

function renderMainChart(labels, data, type) {

                pointBorderWidth: 2

        },

            responsive: true,

                if (points.length) openDrillDown(mainChartInstance.data.labels[points[0].index]);

                y: { border: { dash: [4, 4] }, grid: { color: '#f1f5f9' }, beginAtZero: true }
            }
        }
    });
}

            document.getElementById('kpiDowntime').innerText = down.toFixed(1);

        function analyzeSummaries(data, limit = 100) {
            const counts = {}; const displayMap = {};
            const STOP = new Set(['le','la','les','un','une','des','du','de','d','l','et','ou','a','à','au','aux','en','par','pour','sur','dans','est','sont','ont','fait','être','avoir','ce','se','sa','son','ses','plus','très','trop','peu','ras','ok','non','oui','machine','intervention','maintenance','panne','arret','h','min','car','donc','avec','sans','sous','vers','avant','apres','mais','pas','que','qui','quoi','si','faut','voir','autre','petit','grand','gros','bon','mauvais','hs','changer','remplacer','nettoyage','nettoyer','controle','verifier','verification','test','essai','probleme','defaut']);
            data.forEach(item => {
                const text = (item['Résumé intervention'] || '').toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9\s]/g, " ");
                const words = text.split(/\s+/).filter(w => w.length > 2 && !STOP.has(w));
                const stems = words.map(w => ({ original: w, root: getRootWord(w) }));
                for (let i = 0; i < stems.length; i++) {
                    const itemA = stems[i];
                    counts[itemA.root] = (counts[itemA.root] || 0) + 1;
                    if (!displayMap[itemA.root] || itemA.original.length > displayMap[itemA.root].length) displayMap[itemA.root] = itemA.original;
                }
            });
            return Object.entries(counts).filter(([k, c]) => c > 1).sort((a,b) => b[1] - a[1]).slice(0, limit).map(([k, c]) => [displayMap[k] || k, c]);
        }

        function getRootWord(word) {
            const TYPO = { "postion": "position", "slings": "sling", "cintres": "cintre", "films": "film", "haute": "haut", "bourage": "bourrage", "bloque": "blocage" };
            if (TYPO[word]) return TYPO[word];
            let stem = word.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            if (stem.endsWith('s') || stem.endsWith('x') || stem.endsWith('e')) stem = stem.slice(0, -1);
            if (stem.endsWith("ement")) stem = stem.slice(0, -5);
            return stem;
        }

        function analyzeAndPopulateKeywords() {
            const keywords = analyzeSummaries(rawData, 60);
            const container = document.getElementById('keywordFilterContainer');

                        </div>

                    </label>
                `;
                container.appendChild(div);
            });
        }

        function generateKey(item, groupBy, granularity) {
            if (groupBy === 'date') { 
                const raw = item["Date intervention"]; 
                if(raw&&raw.length===8){
                    const y=raw.substring(0,4),m=raw.substring(4,6),d=raw.substring(6,8);
                    if(granularity==='year')return y;
                    if(granularity==='month')return `${y}-${m}`;
                    if(granularity==='week'){ 
                        const date = new Date(y, m-1, d);
                        const onejan = new Date(date.getFullYear(),0,1);
                        const week = Math.ceil((((date.getTime() - onejan.getTime()) / 86400000) + onejan.getDay() + 1) / 7);
                        return `${y}-S${week}`;
                    }
                } 
                return "Inconnu"; 
            }
            let rawKey = ""; 
            if (groupBy === 'personnel') rawKey = Array.isArray(item["Personnel"])?item["Personnel"][0]:item["Personnel"]; 
            else if (groupBy==='machine') rawKey=item["Désignation machine"]; 
            else if (groupBy==='type_panne') rawKey=item["Type de panne"]; 
            else if (groupBy==='cause') rawKey=item["Cause"]; 
            return (rawKey||"Non renseigné").trim()||"Non renseigné";
        }

            const g=document.getElementById('granularityContainer');

            else { g.classList.add('hidden'); g.classList.remove('flex'); }
            updateChart(); saveState(); 
        }

        }
        function setDefaultDateRange() {
            const today = new Date();
            const past = new Date();
            past.setFullYear(today.getFullYear() - 3);
            if (!document.getElementById('dateStart').value) document.getElementById('dateStart').value = past.toISOString().split('T')[0];

        const parseNum = (v) => { if(!v)return 0; if(Array.isArray(v))return v.reduce((a,c)=>a+parseFloat(c||0),0); return parseFloat(v)||0; };

            </h4>
            <div class="overflow-y-auto pr-1 custom-scrollbar flex-1">
                <ul class="space-y-2">
                    ${topKeywords.map(([word, count]) => `
                        <li class="flex justify-between items-center group cursor-default">
                            <span class="text-xs font-medium text-slate-600 group-hover:text-indigo-700 transition-colors capitalize">${word}</span>
                            <span class="bg-white text-indigo-600 border border-indigo-100 px-2 py-0.5 rounded-full text-[10px] font-bold shadow-sm">${count}</span>
                        </li>
                    `).join('')}
                    ${topKeywords.length === 0 ? '<li class="text-xs text-slate-400 italic">Aucun mot clé significatif trouvé.</li>' : ''}
                </ul>
            </div>
        </div>
    `;
    
    contentHTML += `</div>`; // Fin grid

    // 5. Affichage
    document.getElementById('modalTitle').innerText = label;
    document.getElementById('modalContent').innerHTML = contentHTML;
    
    const modal = document.getElementById('detailModal');
    modal.classList.remove('hidden', 'pointer-events-none', 'opacity-0');
    
    // Relancer les icônes pour le nouveau contenu HTML
    lucide.createIcons();
}

// --- FONCTION UTILITAIRE POUR LISTE AVEC BARRES (Style V3) ---
function generateRankingList(data, keyField, title) {
    // Compter les occurrences
    const counts = {};
    data.forEach(item => { 
        let val = item[keyField]; 
        if (Array.isArray(val)) val = val[0]; 
        val = (val || "Non renseigné").trim(); 
        counts[val] = (counts[val] || 0) + 1; 
    });

    // Trier et garder le Top 10
    const sorted = Object.entries(counts).sort((a,b) => b[1] - a[1]).slice(0, 10);
    const maxVal = sorted.length > 0 ? sorted[0][1] : 1;

    let html = `
        <div class="border border-slate-200 rounded-xl bg-white p-4 shadow-sm flex flex-col h-full">
            <h4 class="font-bold text-slate-700 mb-4 flex items-center gap-2 text-xs uppercase tracking-wider border-b border-slate-100 pb-2">
                <i data-lucide="bar-chart-2" class="w-3 h-3 text-slate-400"></i> ${title}
            </h4>
            <ul class="space-y-3 overflow-y-auto pr-1 custom-scrollbar flex-1">`;
            
    sorted.forEach(([k, v]) => {
        const pct = ((v / maxVal) * 100).toFixed(0);
        html += `
            <li class="relative group">
                <div class="flex justify-between items-center text-xs mb-1 relative z-10">
                    <span class="font-medium text-slate-600 truncate w-3/4 group-hover:text-blue-600 transition-colors" title="${k}">${k}</span>
                    <span class="font-bold text-slate-800 bg-slate-100 px-1.5 py-0.5 rounded text-[10px]">${v}</span>
                </div>
                <div class="h-1.5 w-full bg-slate-100 rounded-full overflow-hidden">
                    <div class="h-full bg-blue-500 rounded-full transition-all duration-500 group-hover:bg-blue-600" style="width: ${pct}%"></div>
                </div>
            </li>`;
    });

    if(sorted.length === 0) html += `<li class="text-xs text-slate-400 italic">Aucune donnée disponible.</li>`;

    html += `</ul></div>`;
    return html;
}

        function closeModal() {
            const modal = document.getElementById('detailModal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        init();
    </script>
