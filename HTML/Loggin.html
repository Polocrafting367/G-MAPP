// ----- Fonctions utilitaires -----
function getContrastColor(hex, alpha = 1) {
  const r = parseInt(hex.substr(1, 2), 16);
  const g = parseInt(hex.substr(3, 2), 16);
  const b = parseInt(hex.substr(5, 2), 16);
  const bgR = Math.round(r * alpha + 255 * (1 - alpha));
  const bgG = Math.round(g * alpha + 255 * (1 - alpha));
  const bgB = Math.round(b * alpha + 255 * (1 - alpha));
  const luminance = 0.299 * bgR + 0.587 * bgG + 0.114 * bgB;
  return luminance > 150 ? '#000000' : '#FFFFFF';
}

function darken(hex, factor = 0.15) {
  const rgb = hex.replace("#", "").match(/.{2}/g).map(h => Math.floor(parseInt(h, 16) * (1 - factor)));
  return `#${rgb.map(v => v.toString(16).padStart(2, '0')).join("")}`;
}

function hexToRgba(hex, alpha = 1) {
  const r = parseInt(hex.substr(1, 2), 16);
  const g = parseInt(hex.substr(3, 2), 16);
  const b = parseInt(hex.substr(5, 2), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function applyDynamicStyles(date = new Date()) {
  const year = date.getFullYear();
  const todayTime = date.getTime();
  const rangeDays = 3;

  let appliedTheme = null;
  let isSpecial = false;

  for (const event of specialEvents) {
    const eventDate = new Date(year, event.date.month, event.date.day);
    const diffInDays = Math.abs((eventDate.getTime() - todayTime) / (1000 * 60 * 60 * 24));
    if (diffInDays <= rangeDays) {
      appliedTheme = event.theme;
      isSpecial = true;
      break;
    }
  }

  if (!appliedTheme) {
    const month = date.getMonth();
    const baseTheme = monthThemes[month];

    appliedTheme = {
      borderColor: baseTheme.borderColor,
      titleColor: baseTheme.titleColor,
      statusColor: hexToRgba(baseTheme.titleColor, 0.15),
      buttonColor: baseTheme.buttonColor
    };
  }

  const titleAlpha = 0.9;
  const statusAlpha = 0.3;
  const titleRgba = hexToRgba(appliedTheme.titleColor, titleAlpha);
  const statusRgba = typeof appliedTheme.statusColor === "string" ? appliedTheme.statusColor : hexToRgba(appliedTheme.statusColor, statusAlpha);
  const hoverColor = darken(appliedTheme.buttonColor, 0.2);

  const style = document.createElement("style");
  style.textContent = `
    .manager-card { border: 2px solid ${appliedTheme.borderColor} !important; }
    .title-bar { background-color: ${titleRgba} !important; color: ${getContrastColor(appliedTheme.titleColor, titleAlpha)} !important; }
    .status-bar { background-color: ${statusRgba} !important; color: ${getContrastColor(statusRgba, 1)} !important; }
    button, #eventButtons button { background-color: ${appliedTheme.buttonColor} !important; color: ${getContrastColor(appliedTheme.buttonColor)} !important; transition: background-color 0.3s ease !important; }
    button:hover, #eventButtons button:hover { background-color: ${hoverColor} !important; color: ${getContrastColor(hoverColor)} !important; }
  `;
  document.head.appendChild(style);
}



function updateBySlider(value) {
  sliderUsed = true;
  const dayOfYear = parseInt(value);
  const simulatedDate = dayOfYearToDate(new Date().getFullYear(), dayOfYear);
  applyDynamicStyles(simulatedDate);
  
  const special = isSpecialEventDay(simulatedDate);
  if (special) {
    document.getElementById("monthDisplay").textContent = `${special.name} (simulation)`;
  } else {
    document.getElementById("monthDisplay").textContent = `${monthThemes[simulatedDate.getMonth()].name} (simulation)`;
  }
}

function dayOfYearToDate(year, dayOfYear) {
  const date = new Date(year, 0);
  date.setDate(dayOfYear);
  return date;
}

function isSpecialEventDay(testDate = new Date()) {
  const year = testDate.getFullYear();
  const time = testDate.getTime();
  const rangeDays = 5;
  for (const event of specialEvents) {
    const eventDate = new Date(year, event.date.month, event.date.day);
    const diffInDays = Math.abs((eventDate.getTime() - time) / (1000 * 60 * 60 * 24));
    if (diffInDays <= rangeDays) {
      return event;
    }
  }
  return null;
}
