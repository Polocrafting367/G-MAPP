<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Beautifier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        .json-key { color: #93c5fd; }
        .json-string { color: #86efac; }
        .json-number { color: #fca5a5; }
        .json-boolean { color: #fdfa72; }
        .json-null { color: #cbd5e1; }
        
        /* Animation du loader */
        .loader {
            border: 4px solid #1e293b;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans h-screen flex flex-col overflow-hidden relative">

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="hidden absolute inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center">
        <div class="loader mb-4"></div>
        <div class="text-xl font-bold text-white">Traitement en cours...</div>
        <div class="text-sm text-slate-400 mt-2">Ne fermez pas la page</div>
    </div>

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur p-4 flex flex-wrap gap-4 justify-between items-center shrink-0">
        <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-blue-500">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 6.75L22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3l-4.5 18" />
            </svg>
            JSON Formatter
        </h1>
        
        <!-- Actions -->
        <div class="flex gap-2 flex-wrap">
            <input type="file" id="fileInput" class="hidden" accept=".json,.txt" onchange="handleFileUpload(this)">
            
            <button onclick="document.getElementById('fileInput').click()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 px-3 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
                </svg>
                Importer
            </button>

            <div class="w-px h-8 bg-slate-700 mx-1 self-center"></div>

            <button onclick="triggerAction('format')" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-lg shadow-blue-900/20">
                Formater
            </button>
            <button onclick="triggerAction('minify')" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                Minifier
            </button>
            <button onclick="downloadJson()" class="bg-emerald-700 hover:bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
                </svg>
                Télécharger
            </button>
            <button onclick="clearAll()" class="text-slate-400 hover:text-red-400 px-3 py-2 text-sm font-medium transition-colors">
                Effacer
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
        <section class="flex-1 flex flex-col border-b md:border-b-0 md:border-r border-slate-800 min-h-[300px] md:min-h-0 relative group">
            <div class="absolute top-2 left-4 text-xs font-bold text-slate-500 uppercase tracking-wider bg-slate-950/80 px-2 rounded">Entrée</div>
            <textarea 
                id="inputArea" 
                placeholder="Collez ou importez votre JSON..." 
                class="w-full h-full bg-slate-950 p-4 pt-8 text-sm font-mono text-slate-300 resize-none focus:outline-none focus:bg-slate-900/50 transition-colors"
                spellcheck="false"></textarea>
        </section>

        <section class="flex-1 flex flex-col bg-slate-900 relative">
            <div class="absolute top-2 left-4 text-xs font-bold text-slate-500 uppercase tracking-wider flex justify-between w-[95%] items-center z-10">
                <span>Résultat</span>
                <button onclick="copyToClipboard()" id="copyBtn" class="text-slate-400 hover:text-white transition-colors flex items-center gap-1 cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-3 h-3">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                    </svg>
                    Copier
                </button>
            </div>
            
            <pre id="outputArea" class="w-full h-full p-4 pt-8 text-sm font-mono overflow-auto selection:bg-blue-500/30"></pre>
            
            <div id="errorToast" class="hidden absolute bottom-4 right-4 bg-red-900/90 text-red-100 px-4 py-3 rounded-lg shadow-xl border border-red-700/50 backdrop-blur max-w-md text-sm z-40">
                <div class="font-bold mb-1">Erreur</div>
                <div id="errorMessage" class="opacity-90 font-mono text-xs"></div>
            </div>
        </section>
    </main>

    <script>
        const inputArea = document.getElementById('inputArea');
        const outputArea = document.getElementById('outputArea');
        const errorToast = document.getElementById('errorToast');
        const errorMessage = document.getElementById('errorMessage');
        const loadingOverlay = document.getElementById('loadingOverlay');
        
        let currentResultRaw = ""; 

        // Gestion centralisée du loading pour laisser le temps au UI de s'afficher
        function triggerAction(actionName) {
            showLoading();
            // setTimeout de 50ms laisse le temps au navigateur d'afficher le loader avant de figer
            setTimeout(() => {
                if (actionName === 'format') formatJson();
                if (actionName === 'minify') minifyJson();
                hideLoading();
            }, 50);
        }

        function showLoading() {
            loadingOverlay.classList.remove('hidden');
        }

        function hideLoading() {
            loadingOverlay.classList.add('hidden');
        }

        function handleFileUpload(input) {
            const file = input.files[0];
            if (!file) return;

            showLoading(); // Affiche le loader immédiatement

            const reader = new FileReader();
            reader.onload = function(e) {
                // Utilisation de setTimeout pour que le loader reste visible si le parsing est lourd
                setTimeout(() => {
                    inputArea.value = e.target.result;
                    formatJson(); 
                    hideLoading();
                }, 50);
            };
            
            reader.onerror = function() {
                showError("Erreur lors de la lecture du fichier");
                hideLoading();
            };

            reader.readAsText(file);
            input.value = ''; 
        }

        function formatJson() {
            const raw = inputArea.value.trim();
            if (!raw) return;

            try {
                const parsed = JSON.parse(raw);
                currentResultRaw = JSON.stringify(parsed, null, 4);
                
                // Limite de rendu HTML pour éviter le crash du navigateur sur les fichiers > 2MB
                if (currentResultRaw.length > 2000000) {
                    outputArea.innerText = currentResultRaw; 
                    showToast("Fichier très lourd : Mode texte simple activé (sans couleurs).", "text-yellow-300");
                } else {
                    outputArea.innerHTML = syntaxHighlight(currentResultRaw);
                }
                hideError();
            } catch (e) {
                showError(e.message);
            }
        }

        function minifyJson() {
            const raw = inputArea.value.trim();
            if (!raw) return;

            try {
                const parsed = JSON.parse(raw);
                currentResultRaw = JSON.stringify(parsed);
                outputArea.innerText = currentResultRaw;
                hideError();
            } catch (e) {
                showError(e.message);
            }
        }

        function downloadJson() {
            if (!currentResultRaw) {
                const raw = inputArea.value.trim();
                if(raw) {
                    triggerAction('format'); // Si pas encore traité, on le fait
                    return; 
                } else {
                    return;
                }
            }
            
            const blob = new Blob([currentResultRaw], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "clean_data.json";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function clearAll() {
            inputArea.value = '';
            outputArea.innerHTML = '';
            currentResultRaw = '';
            hideError();
            inputArea.focus();
        }

        function copyToClipboard() {
            const text = currentResultRaw || outputArea.innerText;
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copyBtn');
                const originalHtml = btn.innerHTML;
                btn.innerHTML = '<span class="text-green-400">Copié !</span>';
                setTimeout(() => btn.innerHTML = originalHtml, 2000);
            });
        }

        function syntaxHighlight(json) {
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                let cls = 'json-number';
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) {
                        cls = 'json-key';
                    } else {
                        cls = 'json-string';
                    }
                } else if (/true|false/.test(match)) {
                    cls = 'json-boolean';
                } else if (/null/.test(match)) {
                    cls = 'json-null';
                }
                return '<span class="' + cls + '">' + match + '</span>';
            });
        }

        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.className = "opacity-90 font-mono text-xs text-red-100";
            errorToast.classList.remove('hidden');
            inputArea.classList.add('bg-red-950/10');
        }

        function showToast(msg, colorClass) {
            errorMessage.textContent = msg;
            errorMessage.className = `opacity-90 font-mono text-xs ${colorClass || ''}`;
            errorToast.classList.remove('hidden');
            setTimeout(() => hideError(), 4000);
        }

        function hideError() {
            errorToast.classList.add('hidden');
            inputArea.classList.remove('bg-red-950/10');
        }

                    trackVisit('JSON CLEAN')

function trackVisit(pageName = "Accueil") {
    // 1. Générer ou récupérer un ID Appareil unique
    let deviceId = localStorage.getItem('app_device_id');
    if (!deviceId) {
        deviceId = 'dev-' + Math.random().toString(36).substr(2, 9) + '-' + Date.now();
        localStorage.setItem('app_device_id', deviceId);
    }

    // 2. Envoyer les données
    fetch('/track.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            deviceId: deviceId,
            page: pageName
        })
    }).catch(e => console.log("Tracking error", e));
}

    </script>
</body>
</html>
